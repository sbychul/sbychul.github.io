<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>소병철 | Profile</title>

    <!-- Google Sans Flex & Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400;6..144,600&family=Noto+Sans+KR:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css?v=1.1" />
  </head>
  <body>
    <div class="layout-wrapper">
      <!-- 프로필 사이드바 (main.js에서 동적 렌더링) -->
      <aside class="sidebar content-box" id="profile-sidebar">
        <!-- Fallback 기본 프로필 -->
        <div class="avatar-container" style="width: 200px; height: 200px">
          <img
            class="profile-avatar"
            src="https://avatars.githubusercontent.com/u/131835031?v=4"
            alt="소병철"
            style="
              width: 100%;
              height: 100%;
              border-radius: 50%;
              object-fit: cover;
            "
          />
        </div>
        <div class="profile-info">
          <div class="name">소병철</div>
          <hr class="profile-divider" />
          <div class="birth">2004.04.27</div>
          <div class="univ">인천대학교 컴퓨터공학부 전공</div>
          <span class="sub"
            >Incheon National Univ. Computer Science & Engineering</span
          >
        </div>
      </aside>

      <!-- 오른쪽: 메인 콘텐츠 -->
      <main class="main-content">
        <!-- Interested In -->
        <section class="content-box">
          <h3>🔍 Interested In</h3>
          <ul id="interests-list"></ul>
        </section>

        <!-- Tech Stack -->
        <section class="content-box">
          <h3>🛠 Tech Stack</h3>
          <div id="tech-stack-content"></div>
        </section>

        <!-- Featured Projects -->
        <section class="content-box">
          <h3>📌 Featured Projects</h3>
          <div id="projects-content"></div>
        </section>

        <!-- GitHub Activity (잔디밭) -->
        <section class="content-box">
          <h3>🌱 GitHub Activity</h3>
          <div id="github-activity-content"></div>
        </section>

        <!-- Beyond Coding -->
        <section class="content-box">
          <h3>🎮 Beyond Coding</h3>
          <ul id="beyond-coding-list"></ul>
        </section>
      </main>
    </div>

    <!-- API 통신 모듈 및 메인 렌더링 스크립트 -->
    <script src="api.js?v=1.1"></script>
    <script src="main.js?v=1.1"></script>
  </body>
</html>
